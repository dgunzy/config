# ============================================================================
# TMUX CONFIGURATION & CHEATSHEET
# ============================================================================

# ----------------------------------------------------------------------------
# PREFIX KEY
# ----------------------------------------------------------------------------
# Change prefix from Ctrl-b to Ctrl-s (more ergonomic with Caps Lock as Ctrl)
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Reload config with prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ----------------------------------------------------------------------------
# GENERAL SETTINGS
# ----------------------------------------------------------------------------
# Start windows and panes at 1, not 0 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on


# Increase scrollback buffer size
set -g history-limit 10000

# Enable focus events (useful for vim/neovim)
set -g focus-events on

# Set default terminal mode to 256 colors
set -g default-terminal "screen-256color"

# Reduce escape time for faster command sequences (good for vim)
set -sg escape-time 10

# ----------------------------------------------------------------------------
# NAVIGATION - VIM STYLE
# ----------------------------------------------------------------------------
# Switch panes using prefix + hjkl (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using prefix + HJKL (hold Shift)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----------------------------------------------------------------------------
# WINDOW & PANE SPLITS
# ----------------------------------------------------------------------------
# Split windows with more intuitive keybindings
bind | split-window -h -c "#{pane_current_path}"  # prefix + | for vertical split
bind - split-window -v -c "#{pane_current_path}"  # prefix + - for horizontal split

# Open new windows in current path
bind c new-window -c "#{pane_current_path}"

# ----------------------------------------------------------------------------
# THEME - CATPPUCCIN
# ----------------------------------------------------------------------------
# Install TPM (Tmux Plugin Manager) first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

# Catppuccin theme customization
set -g @catppuccin_flavour 'mocha' # or 'latte', 'frappe', 'macchiato'

# Move status bar to top
set -g status-position top

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# ============================================================================
# TMUX CHEATSHEET - BASIC COMMANDS
# ============================================================================
#
# PREFIX KEY: Ctrl-s (all commands below require pressing prefix first)
#
# SESSION MANAGEMENT:
#   prefix + d          Detach from session
#   prefix + s          List and switch sessions
#   prefix + $          Rename session
#
# WINDOW MANAGEMENT:
#   prefix + c          Create new window
#   prefix + ,          Rename current window
#   prefix + n          Next window
#   prefix + p          Previous window
#   prefix + 0-9        Jump to window number
#   prefix + &          Kill current window
#   prefix + w          List windows
#
# PANE MANAGEMENT:
#   prefix + |          Split vertically
#   prefix + -          Split horizontally
#   prefix + h/j/k/l    Navigate panes (vim-style)
#   prefix + H/J/K/L    Resize pane (vim-style, hold Shift)
#   prefix + o          Cycle through panes
#   prefix + x          Kill current pane
#   prefix + z          Toggle pane zoom (fullscreen)
#   prefix + {          Move pane left
#   prefix + }          Move pane right
#   prefix + space      Toggle pane layouts
#   prefix + q          Show pane numbers
#
# COPY MODE (for scrolling/selecting):
#   prefix + [          Enter copy mode (use arrow keys or vim keys to scroll)
#   q                   Exit copy mode
#
# OTHER:
#   prefix + :          Enter command mode
#   prefix + ?          List all keybindings
#   prefix + r          Reload config (custom binding)
#
# TERMINAL COMMANDS (outside tmux):
#   tmux                Start new session
#   tmux new -s name    Start new named session
#   tmux ls             List sessions
#   tmux attach         Attach to last session
#   tmux attach -t name Attach to named session
#   tmux kill-session   Kill current session
#   tmux kill-server    Kill all sessions
#
# TPM PLUGIN COMMANDS:
#   prefix + I          Install plugins (after adding to config)
#   prefix + U          Update plugins
#   prefix + alt + u    Uninstall plugins not in list
#
# ============================================================================
